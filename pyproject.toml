[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "neatplus-server"
version = "0.0.0"
description = "Neat+ server"
authors = []
readme = "README.MD"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.13,<4"
dependencies = [
    "Django (>=4.2.16,<5)",
    "environs[django] (>=11.2.1,<12)",
    "marshmallow (>=3.23.1,<4)",
    "psycopg2-binary (>=2.9.10,<3)",
    "djangorestframework (>=3.15.2,<4)",
    "django-filter (>=24.3,<25)",
    "djangorestframework-simplejwt (>=5.3.1,<6)",
    "djangorestframework-camel-case (>=1.4.2,<2)",
    "django-admin-interface (>=0.29.2,<0.30)",
    "django-otp (>=1.5.4,<2)",
    "qrcode (>=8.0,<9)",
    "django-cors-headers (>=4.6.0,<5)",
    "django-silk (>=5.3.1,<6)",
    "django-storages[boto3] (>=1.14.4,<2)",
    "sentry-sdk (>=2.19.0,<3)",
    "celery[redis] (>=5.4.0,<6)",
    "django-modeltranslation (>=0.19.11,<20)",
    "django-ordered-model (>=3.7.4,<4)",
    "drf-spectacular (>=0.27.2,<0.28)",
    "Pillow (>=11.0.0,<12)",
    "django-ckeditor (>=6.7.1,<7)",
    "djangorestframework-gis (>=1.1,<2)",
    "django-admin-autocomplete-filter (>=0.7.1,<0.8)",
    "drf-recaptcha (>=4.0.2,<5)",
    "PyYAML (>=6.0.2,<7)",
    "django-mptt (>=0.16.0,<0.17)",
    "django-oauth-toolkit (>=3.0.1,<4)",
    "watchtower (>=3.3.1,<4)",
    "django-defender (>=0.9.8,<0.10)",
    "django-reversion (>=5.1.0,<6)",
    "drf-flex-fields (>=1.0.2,<2)",
]

[project.optional-dependencies]
asgi = ["uvicorn[standard] (>=0.34.0,<0.35.0)", "gunicorn (>=23.0.0,<24.0.0)"]

[tool.poetry.group.dev.dependencies]
django-extensions = "^3.2.3"
Werkzeug = "^3.1.3"
model-bakery = "^1.20.0"
ruff = "^0.8.0"

[tool.ruff]
extend-exclude = ["**/migrations/*.py"]
